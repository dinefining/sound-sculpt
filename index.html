<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sound Sculpt</title>
<meta name="description" content="Shape sound by sculpting a sphere. Every knob owns a spot on its surface.">
<meta property="og:type" content="website">
<meta property="og:title" content="Sound Sculpt">
<meta property="og:description" content="Shape sound by sculpting a sphere. Every knob owns a spot on its surface.">
<meta property="og:url" content="https://dinefining.github.io/sound-sculpt/">
<meta property="og:image" content="https://dinefining.github.io/sound-sculpt/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Sound Sculpt: a charcoal sphere above a row of synth knobs">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Sound Sculpt">
<meta name="twitter:description" content="Shape sound by sculpting a sphere. Every knob owns a spot on its surface.">
<meta name="twitter:image" content="https://dinefining.github.io/sound-sculpt/og-image.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <div id="bar" aria-label="Playhead"><div id="fill"></div><div id="dot"></div></div>
  <main id="stage">
    <div class="topbar">
      <button class="name" id="smpBtn" aria-haspopup="dialog"><span id="smp">SINE TONE</span></button>
      <div class="keys">
      <button class="sq" id="playBtn" aria-label="Play"></button>
      <button class="sq" id="recBtn" aria-label="Record"></button>
      <button class="sq" id="undoBtn" aria-label="Undo" disabled></button>
      <button class="sq" id="redoBtn" aria-label="Redo" disabled></button>
      <button class="sq" id="upBtn" aria-label="Load a sound"></button>
      <button class="sq" id="downBtn" aria-label="Download WAV"></button>
      <button class="sq" id="colBtn" aria-label="Sphere colour"></button>
      <button class="sq" id="axesBtn" aria-label="Show axes"></button>
      <button class="sq" id="infoBtn" aria-label="Info"></button>
      </div>
    </div>
    <div id="axLabels" hidden></div>
    <div class="pop cols" id="colPop" hidden></div>
    <div class="pop" id="dlPop" hidden></div>
  </main>
  <div id="modal" hidden><div class="panel" role="dialog" aria-modal="true">
    <div class="ph"><span id="mTitle"></span><button id="mClose" aria-label="Close"><svg viewBox="0 0 8 8" width="18" height="18" shape-rendering="crispEdges" fill="currentColor" aria-hidden="true"><rect x="0" y="0" width="1" height="1"/><rect x="0" y="7" width="1" height="1"/><rect x="1" y="1" width="1" height="1"/><rect x="1" y="6" width="1" height="1"/><rect x="2" y="2" width="1" height="1"/><rect x="2" y="5" width="1" height="1"/><rect x="3" y="3" width="1" height="1"/><rect x="3" y="4" width="1" height="1"/><rect x="4" y="3" width="1" height="1"/><rect x="4" y="4" width="1" height="1"/><rect x="5" y="2" width="1" height="1"/><rect x="5" y="5" width="1" height="1"/><rect x="6" y="1" width="1" height="1"/><rect x="6" y="6" width="1" height="1"/><rect x="7" y="0" width="1" height="1"/><rect x="7" y="7" width="1" height="1"/></svg></button></div>
    <div class="pb" id="mBody"></div>
  </div></div>
  <section id="knobs"><div class="bank" id="bankA"></div><div class="bank" id="bankB"></div></section>
  <input type="file" id="fileIn" accept=".wav,.mp3,.ogg,audio/*">
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="app.js"></script>
</body>
</html>
